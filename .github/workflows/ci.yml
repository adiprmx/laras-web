name: CI

on:
  push:
    branches: [main]
  pull_request:

# Red 1 R4: token GitHub minimal — job hanya perlu baca repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      # Red 1 R4: action dipin ke SHA commit penuh (tag mayor bisa
      # dipindah). SHA di bawah adalah ujung tag v4 per 18 Nov 2026.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Red 1 R4: audit dependensi sebagai GERBANG (bukan laporan).
      # Gagal bila ada kerentanan high/critical di dependensi PRODUKSI
      # (yang dikirim ke browser pengguna).
      # Dev-only sengaja TIDAK memblokir: picomatch ReDoS GHSA-fc5q /
      # CVE-2026-112366 menyerang SEMUA versi s.d. 4.0.7 (tidak ada versi
      # yang diperbaiki — terbukti: override ke 4.0.7 tetap ditandai CI
      # run 44242295039, 12 temuan). Satu-satunya jalan keluar adalah
      # menghapus picomatch dari tree (upgrade vitest 5, breaking) —
      # dijadwalkan sebagai pekerjaan terpisah, bukan dibuang. Temuan dev
      # tetap TERCATAT di langkah informasional di bawah (tidak diblokir,
      # tidak disembunyikan).
      - run: npm audit --omit=dev --audit-level=high
      - name: Audit dev (informasional, tidak memblokir)
        continue-on-error: true
        run: npm audit --audit-level=high
      - run: npm run build
      - name: Gerbang H1 — chunk halaman uji dilarang di dist produksi
        run: |
          # Rute /library-test, /player-test, /p4-test adalah DEV-only
          # (Red 1 H1): chunk-nya tidak boleh ada di build produksi.
          # /spike TIDAK dicek di sini — pengecualian koordinator,
          # alat verifikasi §5 yang boleh tetap di produksi.
          found=$(find dist/assets -name '*TestPage*.js' -print)
          if [ -n "$found" ]; then
            echo 'CHUNK UJI DITEMUKAN DI DIST PRODUKSI:'
            echo "$found"
            exit 1
          fi
          echo 'OK: tidak ada chunk *TestPage* di dist/'
      - name: Cek anggaran bundle awal (maks 200 KB gzip)
        run: |
          node -e "
            const fs = require('node:fs');
            const zlib = require('node:zlib');
            const path = require('node:path');
            // Anggaran K4 mengikat BUNDLE AWAL: JS yang diunduh browser saat
            // pertama memuat halaman, yaitu yang dirujuk dist/index.html
            // (script entry + modulepreload). Chunk lazy (halaman spike,
            // solver QuickJS-WASM ~262 KB gzip) TIDAK dihitung karena hanya
            // diunduh saat dibutuhkan. Skrip lama menjumlah SEMUA JS di
            // dist/assets sehingga gagal keliru sejak P1 (total 359.987 byte).
            const html = fs.readFileSync('dist/index.html', 'utf8');
            const refs = new Set();
            for (const m of html.matchAll(/(?:src|href)=\"(\/assets\/[^\"/]+\.js)\"/g)) {
              refs.add(m[1].replace(/^\//, ''));
            }
            if (refs.size === 0) { console.error('TIDAK ADA JS AWAL DI index.html'); process.exit(1); }
            let total = 0;
            for (const f of refs) {
              const gz = zlib.gzipSync(fs.readFileSync(path.join('dist', f))).length;
              console.log('awal:', f, gz, 'byte gzip');
              total += gz;
            }
            console.log('Total bundle awal gzip:', total, 'byte (batas 204800)');
            if (total > 204800) { console.error('BUNDLE AWAL MELEBIHI ANGGARAN'); process.exit(1); }
          "
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: laras-web-dist
          path: app/dist

  e2e:
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Build tetap dibutuhkan walau E2E berjalan terhadap server dev:
      # tests/e2e/security.spec.ts menyajikan dist/ sendiri untuk
      # membuktikan gerbang H1 + header CSP di build produksi.
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: app/playwright-report
