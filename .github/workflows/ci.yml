name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Cek anggaran bundle awal (maks 200 KB gzip)
        run: |
          node -e "
            const fs = require('node:fs');
            const zlib = require('node:zlib');
            const path = require('node:path');
            const assets = fs.readdirSync('dist/assets').filter((f) => f.endsWith('.js'));
            let total = 0;
            for (const f of assets) {
              total += zlib.gzipSync(fs.readFileSync(path.join('dist/assets', f))).length;
            }
            console.log('Total JS gzip:', total, 'byte (batas 204800)');
            if (total > 204800) { console.error('BUNDLE MELEBIHI ANGGARAN'); process.exit(1); }
          "
      - uses: actions/upload-artifact@v4
        with:
          name: laras-web-dist
          path: app/dist

  e2e:
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: app/playwright-report
