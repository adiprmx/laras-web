name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Cek anggaran bundle awal (maks 200 KB gzip)
        run: |
          node -e "
            const fs = require('node:fs');
            const zlib = require('node:zlib');
            const path = require('node:path');
            // Anggaran K4 mengikat BUNDLE AWAL: JS yang diunduh browser saat
            // pertama memuat halaman, yaitu yang dirujuk dist/index.html
            // (script entry + modulepreload). Chunk lazy (halaman spike,
            // solver QuickJS-WASM ~262 KB gzip) TIDAK dihitung karena hanya
            // diunduh saat dibutuhkan. Skrip lama menjumlah SEMUA JS di
            // dist/assets sehingga gagal keliru sejak P1 (total 359.987 byte).
            const html = fs.readFileSync('dist/index.html', 'utf8');
            const refs = new Set();
            for (const m of html.matchAll(/(?:src|href)=\"(\/assets\/[^\"/]+\.js)\"/g)) {
              refs.add(m[1].replace(/^\//, ''));
            }
            if (refs.size === 0) { console.error('TIDAK ADA JS AWAL DI index.html'); process.exit(1); }
            let total = 0;
            for (const f of refs) {
              const gz = zlib.gzipSync(fs.readFileSync(path.join('dist', f))).length;
              console.log('awal:', f, gz, 'byte gzip');
              total += gz;
            }
            console.log('Total bundle awal gzip:', total, 'byte (batas 204800)');
            if (total > 204800) { console.error('BUNDLE AWAL MELEBIHI ANGGARAN'); process.exit(1); }
          "
      - uses: actions/upload-artifact@v4
        with:
          name: laras-web-dist
          path: app/dist

  e2e:
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: app/playwright-report
